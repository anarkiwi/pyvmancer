name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ALSA for python-rtmidi
        # The -dev headers are needed on Pythons with no python-rtmidi wheel (3.13).
        run: sudo apt-get update && sudo apt-get install -y libasound2t64 libasound2-dev
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install --group dev || pip install black pylint pytest pytest-cov pytest-xdist pyserial pyusb
      - name: Format check
        run: black --check .
      - name: Lint
        run: pylint pyvmancer tests
      - name: Test
        run: pytest
