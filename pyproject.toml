[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvmancer"
version = "0.2.1"
description = "Automate the LZX Industries Videomancer over USB MIDI and USB serial"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Josh Bailey", email = "josh@overlyspecific.com" }]
keywords = ["lzx", "videomancer", "midi", "video-synthesis", "usb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = ["mido>=1.3", "python-rtmidi>=1.5", "numpy>=1.24"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
usb = ["pyusb>=1.2"]
all = ["pyserial>=3.5", "pyusb>=1.2"]

[project.urls]
Homepage = "https://github.com/anarkiwi/pyvmancer"
Issues = "https://github.com/anarkiwi/pyvmancer/issues"

[project.scripts]
vmancer = "pyvmancer.cli:main"

[dependency-groups]
dev = [
    "black>=24",
    "pylint>=3.2",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "pyserial>=3.5",
    "pyusb>=1.2",
]

[tool.setuptools.packages.find]
include = ["pyvmancer*"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
addopts = "-n auto --cov=pyvmancer --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["pyvmancer/cli.py"]

[tool.pylint.main]
jobs = 0
# mido resolves open_output/open_input/get_output_names lazily at import time.
ignored-modules = ["mido"]
disable = [
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-public-methods",
    "import-outside-toplevel",
    "broad-exception-caught",
]

[tool.pylint.format]
max-line-length = 110
